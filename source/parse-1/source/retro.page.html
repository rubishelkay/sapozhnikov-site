<meta content="website" property="og:type"/><meta content="https://sergeysapozhnikov.ru/p6838181/" property="og:url"/><meta name="twitter:card" content="summary_large_image"/><meta name="description" content="The installation is composed of a series of small Polaroids arranged on a display table at Palazzo Butera, erected among the ruins of Palazzo Costantino, set in the landscape of the Russian countryside, as well as a selection of larger photographic prints. The artist often works with known and recognisable spaces, showing them from unusual and unexpected perspectives. For this series of new images, Sapozhnikov ‘transported’ the interiors of the decaying noble palace located in Palermo so as to photograph them in his birthplace, Rostov-on-Don, creating works that set themselves apart for their exuberant visual vocabulary combining nature, architecture, and landscape."/><meta content="Sergey Sapozhnikov" property="og:site_name"/><meta content="https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-b7848399-d816-4c0d-aea5-2c6df7b7a99b_readyscr_1024.jpg" property="og:image"/><meta content="Sergey Sapozhnikov — Retrospective 2003-2018" property="og:title"/><meta content="Сергей Анатольевич Сапожников -российский художник, фотограф, куратор.

Художественную деятельность начал уличным граффитистом-бомбилой. Активно занимался фотографией. Окончил факультет психологии Южного федерального университета.

В 2009 году окончил Институт проблем современного искусства Иосифа Бакштейна, курс «Новые художественные стратегии» (Москва).

В сентябре 2014 года в музее Польди-Пеццоли (Милан) состоялась персональная выставка Сапожникова «Total Picture»[4]. Куратором выставки выступил Франческо Бонами[4]. Специально для этого проекта композитором Алексеем Хевелевым был написан цикл фортепианных прелюдий «Последние дни Христа». Автор исполнил этот цикл на открытии выставки в музее Польди-Пеццоли.

В ноябре 2016 года с критиком Владимиром Левашовым реализовал проект «Город», опубликованный в форме авторской книги.

В 2018 году Сергей Сапожников вошел в Российский инвестиционный художественный рейтинг 49ART, представляющий выдающихся современных художников в возрасте до 50 лет." property="og:description"/><script type="application/json" data-content="{&quot;publicPath&quot;:&quot;https://st-p.rmcdn1.net/b45ea352/dist&quot;,&quot;project&quot;:{&quot;isProjectEmailPrivate&quot;:{&quot;allowedDomains&quot;:[],&quot;allowedEmails&quot;:[],&quot;isEnabled&quot;:false},&quot;opts&quot;:{&quot;arrows&quot;:false,&quot;menubutton&quot;:false,&quot;sharebutton&quot;:false,&quot;pagecounter&quot;:false,&quot;endpage&quot;:false,&quot;endpagetype&quot;:&quot;join&quot;,&quot;viewertype&quot;:&quot;horizontal&quot;,&quot;slidein&quot;:false,&quot;scalewidth&quot;:3600,&quot;projectinfo&quot;:false,&quot;hidden&quot;:false,&quot;allowindex&quot;:true,&quot;scalableviewer&quot;:false,&quot;ssl&quot;:true,&quot;lqip&quot;:false,&quot;ga_id&quot;:&quot;&quot;,&quot;favicon&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/upload-94d54922-f580-42c3-91cf-9d36fcdda44a.png&quot;,&quot;controlsontop&quot;:false,&quot;branding&quot;:false,&quot;phoneVerticalAlign&quot;:&quot;top&quot;,&quot;useCustomCursor&quot;:false},&quot;textStyles&quot;:{&quot;global&quot;:[],&quot;project&quot;:[{&quot;name&quot;:&quot;paragraph-1&quot;,&quot;label&quot;:&quot;H1&quot;,&quot;tag&quot;:&quot;h1&quot;,&quot;cssProperties&quot;:{&quot;textAlign&quot;:&quot;left&quot;,&quot;lineHeight&quot;:40,&quot;fontWeight&quot;:&quot;400&quot;,&quot;fontStyle&quot;:&quot;normal&quot;,&quot;fontSize&quot;:30,&quot;fontFamily&quot;:&quot;Roboto&quot;,&quot;color&quot;:&quot;22222264&quot;,&quot;paddingLeft&quot;:0,&quot;paddingRight&quot;:0,&quot;paddingTop&quot;:0,&quot;paddingBottom&quot;:0},&quot;_id&quot;:&quot;606125ed98b5d100c3d671da&quot;},{&quot;name&quot;:&quot;paragraph-2&quot;,&quot;label&quot;:&quot;H2&quot;,&quot;tag&quot;:&quot;h2&quot;,&quot;cssProperties&quot;:{&quot;textAlign&quot;:&quot;left&quot;,&q tantino, set in the landscape of the Russian countryside, as well as a selection of larger photographic prints. The artist often works with known and recognisable spaces, showing them from unusual and unexpected perspectives. For this series of new images, Sapozhnikov ‘transported’ the interiors of the decaying noble palace located in Palermo so as to photograph them in his birthplace, Rostov-on-Don, creating works that set themselves apart for their exuberant visual vocabulary combining nature, architecture, and landscape.&quot;},&quot;isPrivate&quot;:false,&quot;_id&quot;:&quot;5e46af65e56bb62f9ed56ecd&quot;,&quot;num_id&quot;:6838181,&quot;num&quot;:2,&quot;mid&quot;:&quot;5cd462b601c6bb7e82b3979f&quot;,&quot;screenshot&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-b7848399-d816-4c0d-aea5-2c6df7b7a99b_readyscr.jpg&quot;,&quot;viewport_phone_portrait&quot;:{&quot;type&quot;:&quot;scroll&quot;,&quot;enabled&quot;:true,&quot;height&quot;:5208},&quot;title&quot;:&quot;Retrospective 2003-2018&quot;,&quot;arrows_color&quot;:&quot;white&quot;,&quot;used_autolayout&quot;:false,&quot;sectionscroll&quot;:false,&quot;hidden&quot;:false,&quot;height&quot;:14036,&quot;type&quot;:&quot;scroll&quot;,&quot;uri&quot;:&quot;retro&quot;,&quot;children&quot;:[],&quot;pagePath&quot;:&quot;retro&quot;,&quot;pageNestedNum&quot;:&quot;2&quot;,&quot;htmlUrl&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-9f9c0079-c8b7-48d9-9be5-59d8dd7b7e46.html&quot;},{&quot;seo&quot;:{&quot;description&quot;:&quot;The installation is composed of a series of small Polaroids arranged on a display table at Palazzo Butera, erected among the ruins of Palazzo Costantino, set in the landscape of the Russian countryside, as well as a selection of larger photographic prints. The artist often works with known and recognisable spaces, showing them from unusual and unexpected perspectives. For this series of new images, Sapozhnikov ‘transported’ the interiors of the decaying noble palace located in Palermo so as to photograph them in his birthplace, Rostov-on-Don, creating works that set themselves apart for their exuberant visual vocabulary combining nature, architecture, and landscape.&quot;},&quot;isPrivate&quot;:false,&quot;_id&quot;:&quot;5cd473aad3621a12db4d8142&quot;,&quot;num_id&quot;:5170334,&quot;num&quot;:3,&quot;mid&quot;:&quot;5cd462b601c6bb7e82b3979f&quot;,&quot;screenshot&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-42fc1d34-6c5e-47c1-931b-7df647d3c237_readyscr.jpg&quot;,&quot;arrows_color&quot;:&quot;white&quot;,&quot;used_autolayout&quot;:false,&quot;sectionscroll&quot;:false,&quot;hidden&quot;:false,&quot;height&quot;:5854,&quot;type&quot;:&quot;scroll&quot;,&quot;uri&quot;:&quot;a_wonderful_day&quot;,&quot;viewport_phone_portrait&quot;:{&quot;type&quot;:&quot;scroll&quot;,&quot;enabled&quot;:true,&quot;height&quot;:2346},&quot;title&quot;:&quot;A Wonderful Day (2018)&quot;,&quot;children&quot;:[],&quot;pagePath&quot;:&quot;a_wonderful_day&quot;,&quot;pageNestedNum&quot;:&quot;3&quot;,&quot;htmlUrl&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-6e73dfb8-d152-46ad-a395-48a772a27997.html&quot;},{&quot;seo&quot;:{&quot;description&quot;:&quot;Моя бабушка Евгения Васильевна активно документировала на фотоаппарат моё детство и всё, что происходило с нашей семьёй. Так, можно сказать, что любовь к фотографии передалась мне по наследству. Тогда, ребёнком, я понимал этот процесс как способ увековечить события, как воплощённую память о них. Конечно, это банально, но с чего-то же должно всё начинаться?\n \nМои первые опыты с фотографией начались в 1997 году, когда мне было тринадцать лет. Тогда в Ростове-на-Дону было очень модно кататьсяна роликах, и я тоже с головой погрузился в эту субкультуру. В городе была своя роллерская тусовка – мы много общались, катались и, конечно, фотографировали друг друга. Причём – как и в любой субкультуре – тут была своя эстетика. С помощью фотографии мы могли, с одной стороны, оценить, насколько правильно и красиво делаем трюки, а с другой – показать себя на снимках ещё «круче», чем в реальности. Я быстро понял, что поймать интересный момент очень тяжело, поэтому искал способы его смоделировать. Так получалось что-то на стыке документальной и постановочной фотографии, пусть и очень наивной.&quot;},&quot;isPrivate&quot;:false,&quot;_id&quot;:&quot;5cd48d858996727fd1ad3d4f&quot;,&quot;num_id&quot;:5170564,&quot;num&quot;:4,&quot;mid&quot;:&quot;5cd462b601c6bb7e82b3979f&quot;,&quot;screenshot&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-4a695461-8a49-4b46-94b4-b99e2578c620_readyscr.jpg&quot;,&quot;arrows_color&quot;:&quot;white&quot;,&quot;used_autolayout&quot;:false,&quot;sectionscroll&quot;:false,&quot;hidden&quot;:false,&quot;height&quot;:20358,&quot;type&quot;:&quot;scroll&quot;,&quot;uri&quot;:&quot;dance&quot;,&quot;viewport_phone_portrait&quot;:{&quot;height&quot;:23733,&quot;enabled&quot;:true,&quot;type&quot;:&quot;scroll&quot;},&quot;title&quot;:&quot;Dance&quot;,&quot;children&quot;:[],&quot;pagePath&quot;:&quot;dance&quot;,&quot;pageNestedNum&quot;:&quot;4&quot;,&quot;htmlUrl&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-e731021b-86cf-49ca-b551-4b2026217a1b.html&quot;},{&quot;seo&quot;:{&quot;description&quot;:&quot;Senza Titolo (2017)&quot;},&quot;isPrivate&quot;:false,&quot;_id&quot;:&quot;5ceafddb0613e948f017f9d1&quot;,&quot;num_id&quot;:5249327,&quot;num&quot;:5,&quot;mid&quot;:&quot;5cd462b601c6bb7e82b3979f&quot;,&quot;screenshot&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-4458a82f-bac2-4660-9bde-1c72c129097d_readyscr.jpg&quot;,&quot;title&quot;:&quot;Senza titolo&quot;,&quot;arrows_color&quot;:&quot;white&quot;,&quot;used_autolayout&quot;:true,&quot;sectionscroll&quot;:false,&quot;hidden&quot;:false,&quot;height&quot;:14582,&quot;type&quot;:&quot;scroll&quot;,&quot;uri&quot;:&quot;senza_titolo&quot;,&quot;viewport_phone_portrait&quot;:{&quot;enabled&quot;:true,&quot;height&quot;:8628,&quot;type&quot;:&quot;scroll&quot;},&quot;children&quot;:[],&quot;pagePath&quot;:&quot;senza_titolo&quot;,&quot;pageNestedNum&quot;:&quot;5&quot;,&quot;htmlUrl&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-e5d8009d-d2db-4d64-b056-563221f358ba.html&quot;},{&quot;seo&quot;:{&quot;description&quot;:&quot;Untitled (2007-2013)&quot;},&quot;isPrivate&quot;:false,&quot;_id&quot;:&quot;5cfe68dc41bdc70207c7d88c&quot;,&quot;num_id&quot;:5317402,&quot;num&quot;:6,&quot;mid&quot;:&quot;5cd462b601c6bb7e82b3979f&quot;,&quot;screenshot&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-e9d8058a-e68b-49de-ae63-89d8354af9b4_readyscr.jpg&quot;,&quot;title&quot;:&quot;Untitled&quot;,&quot;arrows_color&quot;:&quot;white&quot;,&quot;used_autolayout&quot;:false,&quot;sectionscroll&quot;:false,&quot;hidden&quot;:false,&quot;height&quot;:28835,&quot;type&quot;:&quot;scroll&quot;,&quot;uri&quot;:&quot;untitled&quot;,&quot;viewport_phone_portrait&quot;:{&quot;type&quot;:&quot;scroll&quot;,&quot;enabled&quot;:true,&quot;height&quot;:14248},&quot;children&quot;:[],&quot;pagePath&quot;:&quot;untitled&quot;,&quot;pageNestedNum&quot;:&quot;6&quot;,&quot;htmlUrl&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-0f075a27-f364-431c-98ea-759f0c9d4d8d.html&quot;},{&quot;seo&quot;:{&quot;description&quot;:&quot;The City (2014 – 2016)\n \nФотограф в городе: прекрасное и жизнь\nВладимир Левашов\n \nСлучилось так, что пару лет назад молодой фотохудожник из Ростова-на-Дону Сергей Сапожников вдруг занялся черно-белой съемкой городской среды. Предшествующая деятельность его к такому повороту, казалось бы, не обязывала. Сапожников получил известность благодаря цветным постановочным фотографиям, основой которых служили причудливые конструкции, созданные из хаоса промышленного мусора и бытовых вещей, характерного для местного предметного окружения. То есть материал остался сходным, но вот остальное…\n \nГородская съемка быстро превратилась в серьезное увлечение, по словам автора, «чем дальше, тем менее связанное с современным искусством» или, по крайней мере, с той системой норм, которая таковым именуется. И сформировалась позиция, для современного художника достаточно уникальная. С одной стороны, она означала отказ от концептуальных оснований творческой практики и переход на поле чистой фотографии. С другой же — открытие того разряда визуального ресурса, которого в нашей стране в избытке и который при этом сам по себе, вне узко профессиональной надобности, мало кому интересен.&quot;},&quot;isPrivate&quot;:false,&quot;_id&quot;:&quot;5cd7271762643b128ac7d4a8&quot;,&quot;num_id&quot;:5177370,&quot;num&quot;:7,&quot;mid&quot;:&quot;5cd462b601c6bb7e82b3979f&quot;,&quot;screenshot&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-d81cfd06-65e7-42e4-a82e-06253649c067_readyscr.jpg&quot;,&quot;title&quot;:&quot;The City&quot;,&quot;arrows_color&quot;:&quot;white&quot;,&quot;used_autolayout&quot;:false,&quot;sectionscroll&quot;:false,&quot;hidden&quot;:false,&quot;height&quot;:37587,&quot;type&quot;:&quot;scroll&quot;,&quot;uri&quot;:&quot;the_city&quot;,&quot;viewport_phone_portrait&quot;:{&quot;type&quot;:&quot;scroll&quot;,&quot;enabled&quot;:true,&quot;height&quot;:37478},&quot;children&quot;:[],&quot;pagePath&quot;:&quot;the_city&quot;,&quot;pageNestedNum&quot;:&quot;7&quot;,&quot;htmlUrl&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-8bde5b4c-189f-4c13-ad97-bfe302b86fc1.html&quot;},{&quot;seo&quot;:{&quot;description&quot;:&quot;The Drama Machine (2013 – 2015)\n \nВ работах Сергея Сапожникова Ростов-на-Дону — это повторяющееся и вместе с тем загадочное место присутствия. Родной город художника представлен через его отсутствие — на него указывают пригородные пейзажи, лишенные опознавательных знаков и идентичности, ничем не выделяющаяся, ничья земля, превращенное в свалку строительных отходов необжитое пространство. Художник обращает вспять этот механизм, делая отходы элементами своей перформативной грамматики, генерируя из соединения частей все новые конфигурации, выстраивая перед нами пейзажи с временной и тем не менее мощной, полной витальных сил архитектурой. Исключительный динамизм этих пространственных композиций умножается самим актом фотографирования, подчеркивающим перформативность, избыточность и неуравновешенность конструкции неожиданным кадрированием, эксцентричным цветом, мультиэкспозицией. \n \nЗная поэтику Сапожникова, я была удивлена, когда он заявил, что работает над проектом, посвященным одному из зданий его города, — то ли из-за неожиданного перемещения в центр городского пространства, то ли из-за обращения к архитектурному объекту. Не то сам предмет, не то метод архитектурной фотографии в контексте его художественных интересов мне казались необычными. &quot;},&quot;isPrivate&quot;:false,&quot;_id&quot;:&quot;5cd71182e8513f79a79b559d&quot;,&quot;num_id&quot;:5177229,&quot;num&quot;:8,&quot;mid&quot;:&quot;5cd462b601c6bb7e82b3979f&quot;,&quot;screenshot&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-0d74a44d-4d6f-45aa-8d7a-a70a00e99940_readyscr.jpg&quot;,&quot;title&quot;:&quot;The Drama Machine&quot;,&quot;arrows_color&quot;:&quot;white&quot;,&quot;used_autolayout&quot;:true,&quot;sectionscroll&quot;:false,&quot;hidden&quot;:false,&quot;height&quot;:27426,&quot;type&quot;:&quot;scroll&quot;,&quot;viewport_phone_portrait&quot;:{&quot;type&quot;:&quot;scroll&quot;,&quot;enabled&quot;:true,&quot;height&quot;:43223},&quot;uri&quot;:&quot;the_drama_machine&quot;,&quot;children&quot;:[],&quot;pagePath&quot;:&quot;the_drama_machine&quot;,&quot;pageNestedNum&quot;:&quot;8&quot;,&quot;htmlUrl&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-6bc646d6-4366-4d7c-b0df-6c4b799f8435.html&quot;},{&quot;seo&quot;:{&quot;description&quot;:&quot;Total Picture, Museo Poldi Pezzoli, Milan (2014)\n\nНебольшой музей, феноменальная коллекция; молодой художник, фотограф, Сергей Сапожников, словно маленький Гете, приезжает сюда из России и представляет себе, будто завоевал Италию и овладел ее маленькой жемчужиной, Музеем Польди Пеццоли. В воображаемой истории, которую он сочинил у себя в голове, словно сон, художник разбивает лагерь среди залов этого музея, не осознавая толком, где находится, словно это совершенно неведомая территория. И вот, среди ночи, он начинает исследовать его, открывая его сокровища, познавая его секреты.Его культура и идентичность сталкиваются с чем-то иным. Приехав сюда из эстетически бедного Ростова-на-Дону, Сергей испытывает потрясение при виде богатства того, что, как он всегда думал, существует лишь в книжных фантазиях, но никак не в реальности. Музей превращается в своего рода остров Робинзона Крузо, в таинственное место, которое предстоит познать, но в то же самое время и в персонажа, с которым следует выстроить диалог.Весь проект Сапожникова возник как потребность и необходимость установить связь между двумя разными и далекими друг от друга идентичностями: его собственной и идентичностью коллекции, которая его окружает. Чтобы осуществить эту цель, художник использует элемент вымысла. &quot;},&quot;isPrivate&quot;:false,&quot;_id&quot;:&quot;5ce08397e2d3c750cc64068f&quot;,&quot;num_id&quot;:5209545,&quot;num&quot;:9,&quot;mid&quot;:&quot;5cd462b601c6bb7e82b3979f&quot;,&quot;screenshot&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-2ad2d155-2024-4a77-83aa-cab3a12e25f9_readyscr.jpg&quot;,&quot;title&quot;:&quot;Total Picture&quot;,&quot;arrows_color&quot;:&quot;white&quot;,&quot;used_autolayout&quot;:false,&quot;sectionscroll&quot;:false,&quot;hidden&quot;:false,&quot;height&quot;:10480,&quot;type&quot;:&quot;scroll&quot;,&quot;viewport_phone_portrait&quot;:{&quot;height&quot;:16386,&quot;enabled&quot;:true,&quot;type&quot;:&quot;scroll&quot;},&quot;uri&quot;:&quot;total_picture&quot;,&quot;children&quot;:[],&quot;pagePath&quot;:&quot;total_picture&quot;,&quot;pageNestedNum&quot;:&quot;9&quot;,&quot;htmlUrl&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-1643d01d-cb9a-4918-a074-cf66564192b9.html&quot;},{&quot;seo&quot;:{&quot;description&quot;:&quot;2003 – 2011\n\nРазмышляя о своем развитии как художника и о своем эстетическом восприятии, Сергей Сапожников постоянно задается вопросом: как долго можно жить в ситуации, которую ты придумал сам? Подобные сомнения, вероятно, тревожат многих художников, добившихся стабильного признания и задумывающихся: не стоит ли от него отказаться ради поиска новых способов выражения. Если рассмотреть этот вопрос в буквальном смысле, можно обратиться с ним напрямую к работам Сапожникова, используя его одновременно как формальный и тематический ключ к образам художника. Ведь его фотографии, как кажется, основаны на структурном принципе нестабильности и находятся в состоянии временного равновесия — они похожи на цельные формальные композиции, готовые вот-вот развалиться, в точности как перекошенные структуры, которые Сапожников часто изображает. Его любимый сюжет — человеческая фигура во взаимодействии с пространством, когда она пытается приспособиться к различным средам и в процессе вызывает физическое столкновение органической и неорганической материи — тела, природы, архитектуры и предметов. Одинокий, как правило, герой передвигается среди импровизированных декораций, собранных из разнообразных материалов. Иногда в кадре присутствуют несколько персонажей, но между ними нет взаимодействия: каждая фигура увлечена собственными действиями или позой и изображена как элемент серии. Позы неестественны, сложны, полны динамизма и пружинистой энергии. Финальный кадр — это переплетение едва узнаваемых форм, элементов, сливающихся друг с другом в непрерывном чередовании репрезентации и абстракции, динамизма и неподвижности.&quot;},&quot;isPrivate&quot;:false,&quot;_id&quot;:&quot;5cd72a7b63eb36631b3d3093&quot;,&quot;num_id&quot;:5177439,&quot;num&quot;:10,&quot;mid&quot;:&quot;5cd462b601c6bb7e82b3979f&quot;,&quot;screenshot&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-8320165c-ea85-461d-bf10-0747c646089f_readyscr.jpg&quot;,&quot;title&quot;:&quot;2003-2011&quot;,&quot;arrows_color&quot;:&quot;white&quot;,&quot;used_autolayout&quot;:false,&quot;sectionscroll&quot;:false,&quot;hidden&quot;:false,&quot;height&quot;:54660.5,&quot;type&quot;:&quot;scroll&quot;,&quot;viewport_phone_portrait&quot;:{&quot;type&quot;:&quot;scroll&quot;,&quot;enabled&quot;:true,&quot;height&quot;:34878},&quot;uri&quot;:&quot;2003-2011&quot;,&quot;children&quot;:[],&quot;pagePath&quot;:&quot;2003-2011&quot;,&quot;pageNestedNum&quot;:&quot;10&quot;,&quot;htmlUrl&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-6e42610e-f733-4854-983c-644a424a2535.html&quot;},{&quot;seo&quot;:{&quot;description&quot;:&quot;Сергей Сапожников\nРодился в 1984 году в Ростове-на-Дону, Россия. \n \n2001–2008 \u2028Факультет психологии Южного федерального университета (бывший Ростовский государственный университет), Ростов-на-Дону. \n \n2008 – 2009 Курс «Новые художественные стратегии» Института проблем современного искусства, Москва. \n \nЖивёт и работает в Ростове-на-Дону. &quot;},&quot;isPrivate&quot;:false,&quot;_id&quot;:&quot;5ce0615f64a8126835bac256&quot;,&quot;num_id&quot;:5209370,&quot;num&quot;:11,&quot;mid&quot;:&quot;5cd462b601c6bb7e82b3979f&quot;,&quot;screenshot&quot;:&quot;https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-b1a2ec1e-cbb7-4770-8976-0e6437895913_readyscr.jpg&quot;,&quot;title&quot;:&quot;2010&quot;,&quot;arrows_color&quot;:&quot;white&quot;,&quot;used_autolayout&quot;:false,&quot;sectionscroll&quot;:false,&quot;hidden&quot;:false,&quot;height&quot;:64484,&quot;type&quot;:&quot;scroll&quot;,&quot;viewport_phone_portrait&quot;:{&quot ikov&quot;,&quot;description&quot;:&quot;Сергей Анатольевич Сапожников -российский художник, фотограф, куратор.\n\nХудожественную деятельность начал уличным граффитистом-бомбилой. Активно занимался фотографией. Окончил факультет психологии Южного федерального университета.\n\nВ 2009 году окончил Институт проблем современного искусства Иосифа Бакштейна, курс «Новые художественные стратегии» (Москва).\n\nВ сентябре 2014 года в музее Польди-Пеццоли (Милан) состоялась персональная выставка Сапожникова «Total Picture»[4]. Куратором выставки выступил Франческо Бонами[4]. Специально для этого проекта композитором Алексеем Хевелевым был написан цикл фортепианных прелюдий «Последние дни Христа». Автор исполнил этот цикл на открытии выставки в музее Польди-Пеццоли.\n\nВ ноябре 2016 года с критиком Владимиром Левашовым реализовал проект «Город», опубликованный в форме авторской книги.\n\nВ 2018 году Сергей Сапожников вошел в Российский инвестиционный художественный рейтинг 49ART, представляющий выдающихся современных художников в возрасте до 50 лет.&quot;,&quot;coverPid&quot;:&quot;5cd462b601c6bb7e82b397a0&quot;,&quot;changed&quot;:false,&quot;last_changed&quot;:&quot;2024-12-30T06:56:09.713Z&quot;,&quot;user&quot;:{&quot;_id&quot;:&quot;5b924738956cc300857b8c8a&quot;,&quot;num_id&quot;:19374357,&quot;uri&quot;:&quot;q5&quot;,&quot;ua&quot;:&quot;&quot;,&quot;permissions&quot;:{&quot;can_make_mag_private_by_email&quot;:false,&quot;can_use_analytics&quot;:true,&quot;must_show_branding&quot;:false,&quot;can_use_gtm&quot;:true,&quot;white_label&quot;:true,&quot;can_use_custom_analytics&quot;:false,&quot;can_use_beta_testing&quot;:false,&quot;can_use_e_commerce&quot;:true,&quot;can_use_forms_file_upload&quot;:false,&quot;forms_file_upload_limit&quot;:0,&quot;forms_file_upload_count&quot;:1,&quot;allow_index&quot;:false,&quot;can_use_iframe&quot;:false}},&quot;folder&quot;:&quot;5cd462ad6495ba7ff7cd5017&quot;,&quot;uri&quot;:&quot;ss-01&quot;,&quot;updated&quot;:&quot;2024-12-30T06 "5cd476aaf304aa7e944827ee","5cd476a8d3621a12db4d86e0","5cd476a5d3621a12db4d86da"],"backFixed":[]},"phone_portrait":{"aboveAll":["5d77dd80e9b77a1b074dfc08","5d77e6294f8c4276d7c20d79","5d77de43335fe108d037351a","5cd473f301c6bb7e82b3c2d6","5cd469bbd3621a12db4d6ac8","5cd467c0edb37c464c917b89","5cd462eac9b75733373c8173"],"frontFixed":[],"normal":["5cd7231916047c3fe7875f2d","5cd47abb8996727fd1ad1822","5cd47eee37499e3b27471979","5cd47946edb37c464c91a0a0","5cd47ee69282117951b0cc6e","5cd476ab9282117951b0bc65","5cd47eb9d3621a12db4d968a","5cd476aaf304aa7e944827ee","5cd476a8d3621a12db4d86e0","5cd476a5d3621a12db4d86da"],"backFixed":[]}},"children":[],"pagePath":"a_wonderful_day","pageNestedNum":"3","htmlUrl":"https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-6e73dfb8-d152-46ad-a395-48a772a27997.html"},{"seo":{"description":"Моя бабушка Евгения Васильевна активно документировала на фотоаппарат моё детство и всё, что происходило с нашей семьёй. Так, можно сказать, что любовь к фотографии передалась мне по наследству. Тогда, ребёнком, я понимал этот процесс как способ увековечить события, как воплощённую память о них. Конечно, это банально, но с чего-то же должно всё начинаться?\n \nМои первые опыты с фотографией начались в 1997 году, когда мне было тринадцать лет. Тогда в Ростове-на-Дону было очень модно кататьсяна роликах, и я тоже с головой погрузился в эту субкультуру. В городе была своя роллерская тусовка – мы много общались, катались и, конечно, фотографировали друг друга. Причём – как и в любой субкультуре – тут была своя эстетика. С помощью фотографии мы могли, с одной стороны, оценить, насколько правильно и красиво делаем трюки, а с другой – показать себя на снимках ещё «круче», чем в реальности. Я быстро понял, что поймать интересный момент очень тяжело, поэтому искал способы его смоделировать. Так получалось что-то на стыке документальной и постановочной фотографии, пусть и очень наивной."},"isPrivate":false,"_id":"5cd48d858996727fd1ad3d4f","num_id":5170 ого окружения. То есть материал остался сходным, но вот остальное…\n \nГородская съемка быстро превратилась в серьезное увлечение, по словам автора, «чем дальше, тем менее связанное с современным искусством» или, по крайней мере, с той системой норм, которая таковым именуется. И сформировалась позиция, для современного художника достаточно уникальная. С одной стороны, она означала отказ от концептуальных оснований творческой практики и переход на поле чистой фотографии. С другой же — открытие того разряда визуального ресурса, которого в нашей стране в избытке и который при этом сам по себе, вне узко профессиональной надобности, мало кому интересен."},"isPrivate":false,"_id":"5cd7271762643b128ac7d4a8","num_id":5177370,"num":7,"mid":"5cd462b601c6bb7e82b3979f","screenshot":"https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-d81cfd06-65e7-42e4-a82e-06253649c067_readyscr.jpg","title":"The City","arrows_color":"white","used_autolayout":false,"sectionscroll":false,"hidden":false,"height":37587,"type":"scroll","wids":["5cd7271762643b128ac7d4a9","5cd7271762643b128ac7d4aa","5cd7274c5061c173a8f71318","5cd7274e16047c3fe78765b7","5cd7274f65ff485a0fc8662a","5cd727508505fc01fc7bf8f9","5cd7275263eb36631b3d2a3d","5cd7275316047c3fe78765c1","5cd7275562643b128ac7d533","5cd727578fc3b11e3c1d8584","5cd7275816047c3fe78765c8","5cd72759bb85de03870fba33","5cd7275af05b2644d7054d70","5cd7275b79ae2d05e565c64e","5cd7275c1d272913093facc5","5cd7275d1d272913093facc7","5cd7275e03f4ba30c54dd141","5cd7275fd3bd8e7b04a99e23","5cd727638505fc01fc7bf918","5cd7276365ff485a0fc86651","5cd72765013cd57ad9700c2f","5cd727675061c173a8f7134b","5cd72768d3bd8e7b04a99e36","5cd7276962643b128ac7d553","5cd7276ce8513f79a79b7858","5cd7276c62643b128ac7d559","5cd7276f8fc3b11e3c1d85ac","5cd7277065ff485a0fc86672","5cd72771013cd57ad9700c46","5cd727721d272913093face3","5cd72774ba8d5775c4f628e8","5cd72774013cd57ad9700c4d","5cd72777d3bd8e7b04a99e58","5cd72778d3bd8e7b04a99e5d","5ceae5203260cc0acda92cee"],"uri":"the_ci 5e03f4ba30c54dd141","5cd7275d1d272913093facc7","5cd7275c1d272913093facc5","5cd7275b79ae2d05e565c64e","5cd7275af05b2644d7054d70","5cd72759bb85de03870fba33","5cd7275816047c3fe78765c8","5cd727578fc3b11e3c1d8584","5cd7275562643b128ac7d533","5cd7275316047c3fe78765c1","5cd7275263eb36631b3d2a3d","5cd727508505fc01fc7bf8f9","5cd7274f65ff485a0fc8662a","5cd7274e16047c3fe78765b7","5cd7274c5061c173a8f71318","5cd7271762643b128ac7d4aa"],"backFixed":[]}},"children":[],"pagePath":"the_city","pageNestedNum":"7","htmlUrl":"https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-8bde5b4c-189f-4c13-ad97-bfe302b86fc1.html"},{"seo":{"description":"The Drama Machine (2013 – 2015)\n \nВ работах Сергея Сапожникова Ростов-на-Дону — это повторяющееся и вместе с тем загадочное место присутствия. Родной город художника представлен через его отсутствие — на него указывают пригородные пейзажи, лишенные опознавательных знаков и идентичности, ничем не выделяющаяся, ничья земля, превращенное в свалку строительных отходов необжитое пространство. Художник обращает вспять этот механизм, делая отходы элементами своей перформативной грамматики, генерируя из соединения частей все новые конфигурации, выстраивая перед нами пейзажи с временной и тем не менее мощной, полной витальных сил архитектурой. Исключительный динамизм этих пространственных композиций умножается самим актом фотографирования, подчеркивающим перформативность, избыточность и неуравновешенность конструкции неожиданным кадрированием, эксцентричным цветом, мультиэкспозицией. \n \nЗная поэтику Сапожникова, я была удивлена, когда он заявил, что работает над проектом, посвященным одному из зданий его города, — то ли из-за неожиданного перемещения в центр городского пространства, то ли из-за обращения к архитектурному объекту. Не то сам предмет, не то метод архитектурной фотографии в контексте его художественных интересов мне казались необычными. "},"isPrivate":false,"_id":"5cd71182e8513f79a79b559d","num_id":5177229,"num":8,"mid":"5cd46 tml"},{"seo":{"description":"Total Picture, Museo Poldi Pezzoli, Milan (2014)\n\nНебольшой музей, феноменальная коллекция; молодой художник, фотограф, Сергей Сапожников, словно маленький Гете, приезжает сюда из России и представляет себе, будто завоевал Италию и овладел ее маленькой жемчужиной, Музеем Польди Пеццоли. В воображаемой истории, которую он сочинил у себя в голове, словно сон, художник разбивает лагерь среди залов этого музея, не осознавая толком, где находится, словно это совершенно неведомая территория. И вот, среди ночи, он начинает исследовать его, открывая его сокровища, познавая его секреты.Его культура и идентичность сталкиваются с чем-то иным. Приехав сюда из эстетически бедного Ростова-на-Дону, Сергей испытывает потрясение при виде богатства того, что, как он всегда думал, существует лишь в книжных фантазиях, но никак не в реальности. Музей превращается в своего рода остров Робинзона Крузо, в таинственное место, которое предстоит познать, но в то же самое время и в персонажа, с которым следует выстроить диалог.Весь проект Сапожникова возник как потребность и необходимость установить связь между двумя разными и далекими друг от друга идентичностями: его собственной и идентичностью коллекции, которая его окружает. Чтобы осуществить эту цель, художник использует элемент вымысла. "},"isPrivate":false,"_id":"5ce08397e2d3c750cc64068f","num_id":5209545,"num":9,"mid":"5cd462b601c6bb7e82b3979f","screenshot":"https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/Screenshot-2ad2d155-2024-4a77-83aa-cab3a12e25f9_readyscr.jpg","title":"Total Picture","arrows_color":"white","used_autolayout":false,"sectionscroll":false,"hidden":false,"height":10480,"type":"scroll","wids":["5ce08397e2d3c750cc640690","5ce08397e2d3c750cc640691","5ce0846464a8126835baf7a2","5ce0848be2d3c750cc6407f3","5ce084ab32b6ed323bfaa60d","5ce084e817f5ea682b5ae81a","5ce0851717f5ea682b5ae856","5ce0851817f5ea682b5ae857","5ce08554e2d3c750cc6408d6","5ce0859017f5ea682b5ae8e5","5ce085b828ecb001fcfd85 c750cc6408d6","5ce0851817f5ea682b5ae857","5ce0851717f5ea682b5ae856","5ce084e817f5ea682b5ae81a","5ce084ab32b6ed323bfaa60d","5ce0848be2d3c750cc6407f3","5ce6dba0ce998201cda1233c","5ce0846464a8126835baf7a2","5ce08397e2d3c750cc640691"],"backFixed":[]}},"children":[],"pagePath":"total_picture","pageNestedNum":"9","htmlUrl":"https://c-p.rmcdn.net/5b924738956cc300857b8c8a/1407828/HtmlSnippet-1643d01d-cb9a-4918-a074-cf66564192b9.html"},{"seo":{"description":"2003 – 2011\n\nРазмышляя о своем развитии как художника и о своем эстетическом восприятии, Сергей Сапожников постоянно задается вопросом: как долго можно жить в ситуации, которую ты придумал сам? Подобные сомнения, вероятно, тревожат многих художников, добившихся стабильного признания и задумывающихся: не стоит ли от него отказаться ради поиска новых способов выражения. Если рассмотреть этот вопрос в буквальном смысле, можно обратиться с ним напрямую к работам Сапожникова, используя его одновременно как формальный и тематический ключ к образам художника. Ведь его фотографии, как кажется, основаны на структурном принципе нестабильности и находятся в состоянии временного равновесия — они похожи на цельные формальные композиции, готовые вот-вот развалиться, в точности как перекошенные структуры, которые Сапожников часто изображает. Его любимый сюжет — человеческая фигура во взаимодействии с пространством, когда она пытается приспособиться к различным средам и в процессе вызывает физическое столкновение органической и неорганической материи — тела, природы, архитектуры и предметов. Одинокий, как правило, герой передвигается среди импровизированных декораций, собранных из разнообразных материалов. Иногда в кадре присутствуют несколько персонажей, но между ними нет взаимодействия: каждая фигура увлечена собственными действиями или позой и изображена как элемент серии. Позы неестественны, сложны, полны динамизма и пружинистой энергии. Финальный кадр — это переплетение едва узнаваемых форм, элементов, сливающихся друг с другом в
